<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>

      <link rel="stylesheet" href="form.css">
      <script src="form.js"></script>
      
</head>
<body>
      
      <form id="signupForm" class="form">
            <h2 class="sign-up">Sign Up Form</h2>
            <div class="div">
                  <label for="name">Name: </label><br>
                  <input type="text" name="name" id="name" placeholder="Enter Your Name">
                  <p id="nameError" class="error"></p>
            </div>

            <div class="div">
                  <label for="email">Email: </label><br>
                  <input type="text" name="email" id="email" placeholder="name@gmail.com">
                  <p id="emailError" class="error"></p>
            </div>
            <div class="div"> 
                  <label for="password">Password: </label><br>
                  <input type="password" name="confirm" id="password" placeholder="Enter Min 8 Characters">
                  <p id="passwordError" class="error"></p>
            </div>
            <div class="div">
                  <label for="confirm">Confirm Password: </label><br>
                  <input type="password" name="name" id="confirm" placeholder="Repeat Your Password">
                  <p id="confirmError" class="error"></p> 
             <button>Sign Up</button>

            </div>

          
            <p id="result"></p>

      </form>


</body>
</html>
